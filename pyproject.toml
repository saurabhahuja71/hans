[project]
name = "hans"
version = "0.4.0"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.22.3",
    "textual>=0.58.0",
]

[project.scripts]
hans = "bolt_next.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
